name: Update tracker

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JobSpy (jobs.py guards the import -- a failed/missing install never fails this step)
        continue-on-error: true
        run: pip install --quiet python-jobspy==1.4.1

      - name: Run streams (stdlib only except JobSpy; each stream keeps its last good data if it fails)
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          REGS_API_KEY: ${{ secrets.REGS_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: |
          python3 src/news.py
          python3 src/bills.py
          python3 src/legiscan.py
          python3 src/comments.py
          python3 src/grants.py
          python3 src/jobs.py
          python3 src/outlets.py
          python3 src/alerts.py
          python3 src/congress.py

      - name: NJDEP hearings probe (informational only -- dep.nj.gov is WAF-walled; never fails the run)
        continue-on-error: true
        run: python3 src/njdep_probe.py

      - name: Build the page (unencrypted, local only)
        run: python3 src/build_page.py

      - name: Set up Node (StatiCrypt only)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Encrypt the page with StatiCrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGE_PIN }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::PAGE_PIN secret is not set. Refusing to deploy an unencrypted page."
            exit 1
          fi
          # Version pinned to 3.5.4: flags checked live with `npx staticrypt@3.5.4 --help` during this build.
          npx --yes staticrypt@3.5.4 build/index.html \
            --remember 30 \
            --template-title "NJ EJ Tracker" \
            --short \
            -d public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save data back to the repo (after deploy; never blocks the page)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "auto: refresh tracker data [skip ci]"
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push origin HEAD:main
